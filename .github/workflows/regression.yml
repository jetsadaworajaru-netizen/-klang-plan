name: Klang Plan Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression checks
        run: node scripts/regression-check.mjs

  public-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase Auth health
        run: |
          curl --fail --show-error --silent \
            -H 'apikey: sb_publishable_XRFWoASv4QIXFTHzHmAHgQ_aTRLr9eK' \
            'https://vyeemrmzlzqaycpbmuyc.supabase.co/auth/v1/settings' >/dev/null
      - name: Check public pages
        run: |
          for url in \
            https://klang-plan.pages.dev/ \
            https://klang-plan.pages.dev/teacher.html \
            https://klang-plan.pages.dev/member-app.html \
            https://klang-plan.pages.dev/admin-panel.html
          do
            curl --fail --show-error --silent --location "$url" >/dev/null
          done
