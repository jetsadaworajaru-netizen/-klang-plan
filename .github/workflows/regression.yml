name: Klang Plan Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check member app JavaScript syntax
        run: node --check member-app.js

      - name: Run regression checks
        run: node scripts/regression-check.mjs

  public-smoke:
    needs: frontend-regression
    runs-on: ubuntu-latest
    steps:
      - name: Allow Pages deployment to settle
        if: github.event_name == 'push'
        run: sleep 30

      - name: Check Supabase Auth health
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent --connect-timeout 10 --max-time 30 \
              -H 'apikey: sb_publishable_XRFWoASv4QIXFTHzHmAHgQ_aTRLr9eK' \
              'https://vyeemrmzlzqaycpbmuyc.supabase.co/auth/v1/settings' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Check production pages and critical assets
        shell: bash
        run: |
          set -e
          check() {
            url="$1"
            for attempt in 1 2 3 4 5; do
              if curl --fail --show-error --silent --location --connect-timeout 10 --max-time 30 "$url" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          for url in \
            https://klang-plan.pages.dev/ \
            https://klang-plan.pages.dev/teacher.html \
            https://klang-plan.pages.dev/member-app.html \
            https://klang-plan.pages.dev/admin-panel.html \
            https://klang-plan.pages.dev/join.html \
            https://klang-plan.pages.dev/config.js \
            https://klang-plan.pages.dev/member-app.js \
            https://klang-plan.pages.dev/admin.js \
            https://klang-plan.pages.dev/data.json
          do
            check "$url"
          done

      - name: Check production member runtime markers
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -o 'member-app.js?v=[0-9]*' member-app.html | tail -1)"
          expected_build="$(grep -o 'data-build="[0-9]*"' member-app.html | tail -1)"
          echo "Waiting for production: $expected_js / $expected_build"

          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --fail --silent --location --connect-timeout 10 --max-time 30 \
              "https://klang-plan.pages.dev/member-app.html?smoke=${GITHUB_SHA}" -o /tmp/member.html || true

            if grep -q "$expected_js" /tmp/member.html && grep -q "$expected_build" /tmp/member.html; then
              ready=1
              break
            fi

            echo "Production has not reached the latest member app build yet (attempt $attempt/8)"
            sleep 15
          done

          test "$ready" = "1"

          curl --fail --silent --location --connect-timeout 10 --max-time 30 \
            "https://klang-plan.pages.dev/member-app.js?smoke=${GITHUB_SHA}" -o /tmp/member.js

          node --check /tmp/member.js
          grep -q "function openResourceConfigurator" /tmp/member.js
          grep -q "\$\$('\[data-sublesson-resource\]').forEach" /tmp/member.js
          grep -q "\$\$('\[data-unit-resource\]').forEach" /tmp/member.js
          grep -q 'function downloadTeachingPack' /tmp/member.js
          grep -q 'function openQuizStudio' /tmp/member.js
          grep -q 'function openRubricStudio' /tmp/member.js
          grep -q 'function openGameStudio' /tmp/member.js
