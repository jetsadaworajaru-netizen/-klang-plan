name: Supabase Auth Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/auth-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Supabase Auth endpoints
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          {
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "== settings =="
            curl -sS -D /tmp/settings_headers.txt -o /tmp/settings_body.txt \
              -H 'apikey: sb_publishable_XRFWoASv4QIXFTHzHmAHgQ_aTRLr9eK' \
              'https://vyeemrmzlzqaycpbmuyc.supabase.co/auth/v1/settings'
            echo "curl_exit=$?"
            head -n 1 /tmp/settings_headers.txt
            cat /tmp/settings_body.txt
            echo
            echo
            echo "== password grant with intentionally invalid credentials =="
            curl -sS -D /tmp/token_headers.txt -o /tmp/token_body.txt \
              -X POST \
              -H 'apikey: sb_publishable_XRFWoASv4QIXFTHzHmAHgQ_aTRLr9eK' \
              -H 'content-type: application/json' \
              --data '{"email":"diagnostic-do-not-create@example.invalid","password":"definitely-wrong-password"}' \
              'https://vyeemrmzlzqaycpbmuyc.supabase.co/auth/v1/token?grant_type=password'
            echo "curl_exit=$?"
            head -n 1 /tmp/token_headers.txt
            cat /tmp/token_body.txt
            echo
          } > diagnostics/auth-latest.txt

      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/auth-latest.txt
          git commit -m "Update Supabase auth diagnostic" || exit 0
          git push

